<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 540" width="100%" height="100%">
  <defs>
    <style>
      .brand-font { font-family: 'Arial Black', 'Impact', 'Trebuchet MS', sans-serif; font-weight: 900; }
      .sub-font { font-family: 'Arial', 'Helvetica', sans-serif; font-weight: 700; letter-spacing: 5px; }
    </style>
  </defs>
  
  <!-- Outer Rounded Shield / Triangle Border -->
  <path d="M 300 28 
           C 365 28, 515 350, 555 405 
           C 580 440, 550 495, 485 495 
           L 115 495 
           C 50 495, 20 440, 45 405 
           C 85 350, 235 28, 300 28 Z" 
        fill="#FFFFFF" 
        stroke="#FF6B00" 
        stroke-width="28" 
        stroke-linejoin="round" 
        stroke-linecap="round" />

  <!-- CAR SILHOUETTE (Orange) -->
  <g transform="translate(195, 120)">
    <!-- Roof / Cabin -->
    <path d="M 45 65 C 55 25, 75 15, 100 15 C 125 15, 145 25, 155 65 Z" fill="#FF6B00" />
    <!-- Windshield cut -->
    <path d="M 53 62 C 60 32, 75 22, 100 22 C 125 22, 140 32, 147 62 Z" fill="#FFFFFF" />
    <!-- Center rearview mirror -->
    <rect x="94" y="22" width="12" height="6" rx="2" fill="#FF6B00" />
    
    <!-- Car Body -->
    <path d="M 20 70 C 20 62, 35 62, 45 65 L 155 65 C 165 62, 180 62, 180 70 L 188 100 C 192 120, 185 140, 180 155 L 20 155 C 15 140, 8 120, 12 100 Z" fill="#FF6B00" />
    
    <!-- Headlights -->
    <path d="M 25 80 C 25 72, 55 72, 60 85 C 62 95, 30 102, 25 80 Z" fill="#FFFFFF" />
    <path d="M 175 80 C 175 72, 145 72, 140 85 C 138 95, 170 102, 175 80 Z" fill="#FFFFFF" />
    
    <!-- Grille Lines -->
    <path d="M 65 110 L 135 110 M 68 118 L 132 118 M 72 126 L 128 126 M 78 134 L 122 134" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />
    
    <!-- Wheels / Bumper base -->
    <rect x="22" y="150" width="30" height="12" rx="4" fill="#FF6B00" />
    <rect x="148" y="150" width="30" height="12" rx="4" fill="#FF6B00" />
  </g>

  <!-- WRENCH GRAPHIC (Dark Navy Blue) -->
  <g transform="translate(290, 110)">
    <!-- Wrench Top Head -->
    <path d="M 25 0 
             C 42 0, 55 12, 55 28 
             C 55 38, 48 46, 40 50 
             L 40 145 
             C 48 149, 55 158, 55 168 
             C 55 184, 42 196, 25 196 
             C 8 196, -5 184, -5 168 
             C -5 158, 2 149, 10 145 
             L 10 50 
             C 2 46, -5 38, -5 28 
             C -5 12, 8 0, 25 0 Z" fill="#002B49" />
    <!-- Top Open Jaw Cutout -->
    <path d="M 25 8 L 36 28 L 14 28 Z" fill="#FFFFFF" />
    <circle cx="25" cy="28" r="12" fill="#FFFFFF" />
    <rect x="16" y="0" width="18" height="28" fill="#FFFFFF" />
    <!-- Bottom Hex Ring Cutout -->
    <polygon points="25,155 33,160 33,170 25,175 17,170 17,160" fill="#FFFFFF" />
  </g>

  <!-- BRAND NAME TEXT: mCarFix® -->
  <g transform="translate(300, 365)">
    <text text-anchor="middle" class="brand-font" font-size="76">
      <tspan fill="#002B49">m</tspan><tspan fill="#FF6B00">Car</tspan><tspan fill="#002B49">Fix</tspan>
    </text>
    <!-- Registered trademark symbol -->
    <text x="215" y="-38" fill="#FF6B00" class="brand-font" font-size="24">®</text>
  </g>

  <!-- SUBTITLE: —— GLOBAL —— -->
  <g transform="translate(300, 410)">
    <line x1="-200" y1="-6" x2="-75" y2="-6" stroke="#FF6B00" stroke-width="2.5" />
    <text x="0" y="0" text-anchor="middle" fill="#002B49" class="sub-font" font-size="20">GLOBAL</text>
    <line x1="75" y1="-6" x2="200" y2="-6" stroke="#FF6B00" stroke-width="2.5" />
  </g>
</svg>